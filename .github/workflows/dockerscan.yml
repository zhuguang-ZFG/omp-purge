name: dockerscan

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: info
        run: |
          python3 - <<'PY'
          import concurrent.futures
          import json
          import urllib.request

          ips = [line.strip() for line in open("targets/docker_ips.txt") if line.strip()]

          def info(ip):
              try:
                  with urllib.request.urlopen(f"http://{ip}:2375/info", timeout=4) as resp:
                      data = json.loads(resp.read(200000))
                  if "NCPU" not in data:
                      return None
                  return (ip, data.get("NCPU"), round((data.get("MemTotal") or 0) / 1024**3, 1),
                          data.get("Name"), data.get("OperatingSystem"))
              except Exception:
                  return None

          live = []
          with concurrent.futures.ThreadPoolExecutor(max_workers=128) as pool:
              for row in pool.map(info, ips):
                  if row:
                      live.append(row)
          live.sort(key=lambda r: (r[1] or 0) * (r[2] or 0), reverse=True)
          print(f"scanned={len(ips)} live={len(live)}", flush=True)
          for row in live[:40]:
              print("DOCKER", row, flush=True)
          for row in live:
              if (row[1] or 0) >= 32:
                  print("HIGHSPEC", row, flush=True)
          PY
